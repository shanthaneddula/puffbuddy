name: Importer foundation tests

on:
  push:
    branches:
      - feature/ai-product-importer-foundation
  pull_request:
    branches:
      - integration/app-source

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free unit tests
        run: npm test
